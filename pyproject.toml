[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chezmoi-autosync"
version = "0.1.0"
description = "Daemon that watches chezmoi source directory and auto-pushes changes to a hostname-based branch for review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jesse DeFer" }]
keywords = ["chezmoi", "dotfiles", "sync", "daemon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "watchdog>=4.0.0,<6",
]

[project.urls]
Homepage = "https://github.com/bootswithdefer/chezmoi-autosync"
Repository = "https://github.com/bootswithdefer/chezmoi-autosync"
Issues = "https://github.com/bootswithdefer/chezmoi-autosync/issues"

[project.scripts]
chezmoi-autosync = "chezmoi_autosync.cli:main"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
]
